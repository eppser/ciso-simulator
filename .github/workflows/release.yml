name: Audit and publish CISO Simulator
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ciso-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm test
      - run: node tools/super-audit.mjs
      - run: node tools/pacing-audit.mjs
      - run: node tools/firewall-economy-audit.mjs
      - run: npm run build:release
      - run: node tools/check-public-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: validated-game
          path: dist
          include-hidden-files: true
  deploy:
    needs: audit
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: validated-game
          path: dist
      - uses: cloudflare/wrangler-action@v3
        with:
          # Match staging; the action's old default ignores wrangler.jsonc bindings.
          wranglerVersion: '4.127.1'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ciso-simulator --branch=main
      - name: Production route checks
        run: |
          node --input-type=module <<'JS'
          import {RULESET,SCENARIO} from './src/scoreboard-config.js';
          const base='https://ciso-simulator.pages.dev';
          for(const route of ['/', '/scoreboard', '/api/scores?org=startup']){
            let good=false;
            for(let attempt=0;attempt<12;attempt++){
              const r=await fetch(base+route);
              let valid=r.ok;
              if(valid&&route.startsWith('/api/')){const data=await r.json();valid=Array.isArray(data.rows)&&data.ruleset===RULESET&&data.scenario===SCENARIO;}
              if(valid){good=true;break;}
              await new Promise(resolve=>setTimeout(resolve,5000));
            }
            if(!good)throw Error('Production route failed: '+route);
          }
          JS
