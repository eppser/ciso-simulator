<h1>CISO Simulator — a free cybersecurity tower-defense game</h1>
<p>You run security for one company, for one day. Choose your company, spend a fixed budget on controls, defend three uplinks, and keep the business alive until the board meeting. A session takes about 22 minutes in a desktop browser. No install, no login, free.</p>
<h2>What makes it different</h2>
<ul>
<li>Attacks are driven by <strong>real exploitation observations</strong> from the Shadowserver Foundation honeypot network, supplied through ZeroDayClock.</li>
<li>Three companies of increasing difficulty: Nordlicht Labs, Halden Logistics and Meridian Financial Group.</li>
<li>Every run produces a comparable score, published on a publicly verifiable scoreboard.</li>
<li>You can load your own SIEM export — Elastic, Splunk or Sentinel — and play your own bad day.</li>
</ul>
<h2>Who plays it</h2>
<p>CISOs, security leaders, SOC analysts and security-awareness trainers, plus anyone who wants to feel the trade-off between budget, controls and incident response without the career damage.</p>
<p><strong>This game needs JavaScript.</strong> Enable it to play, or read <a href="https://github.com/eppser/ciso-simulator">the source and design notes on GitHub</a>.</p>
